services:
  front:
    extends:
      file: compose.base.yaml
      service: front
    build:
      context: .
      dockerfile: ./front/Dockerfile
      target: build
    command: bun run dev
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      - root_node_modules:/app/node_modules
      - front_node_modules:/app/front/node_modules
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3001
    networks:
      - frontend
      - backend

  back:
    extends:
      file: compose.base.yaml
      service: back
    build:
      context: .
      dockerfile: ./back/Dockerfile
      target: build
    command: sh -c "cd back && bun run start:dev"
    ports:
      - "3001:3001"
    volumes:
      - ./:/app
      - root_node_modules:/app/node_modules
      - back_node_modules:/app/back/node_modules
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/template
      - JWT_SECRET=change-me-in-production
      - JWT_EXPIRATION=15m
      - JWT_ISSUER=gameplate
      - MAGIC_LINK_SECRET=change-me-in-production
      - MAGIC_LINK_EXPIRATION_MIN=15
      - FRONTEND_URL=http://localhost:3000
    networks:
      - backend

  postgres:
    extends:
      file: compose.base.yaml
      service: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend

  nginx:
    extends:
      file: compose.base.yaml
      service: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - frontend
      - backend

volumes:
  postgres_data:
  root_node_modules:
  front_node_modules:
  back_node_modules:

networks:
  frontend:
  backend:
