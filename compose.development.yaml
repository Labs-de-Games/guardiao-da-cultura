services:
  nginx:
    build:
      context: .
      dockerfile: ./nginx/Dockerfile
      args:
        - NGINX_CONFIG=nginx.development.conf
    environment:
      - FRONTEND_PORT=${FRONTEND_PORT:-3000}
      - BACKEND_PORT=${BACKEND_PORT:-3001}
    ports:
      - "${NGINX_PORT:-80}:80"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:80/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      front:
        condition: service_healthy
      back:
        condition: service_healthy
    networks:
      - frontend
      - backend

  front:
    build:
      context: .
      dockerfile: ./front/Dockerfile
      target: build
      args:
        - NEXT_PUBLIC_ENV=development
        - NEXT_PUBLIC_POSTHOG_KEY=${NEXT_PUBLIC_POSTHOG_KEY:-}
        - NEXT_PUBLIC_POSTHOG_HOST=${NEXT_PUBLIC_POSTHOG_HOST:-https://us.i.posthog.com}
        - RESPONSIVEVOICE_API_KEY=${RESPONSIVEVOICE_API_KEY:-}
    command: npm run dev
    ports:
      - "${FRONTEND_PORT:-3000}:${FRONTEND_PORT:-3000}"
    volumes:
      - ./:/app
      - root_node_modules:/app/node_modules
      - front_node_modules:/app/front/node_modules
    environment:
      - PORT=${FRONTEND_PORT:-3000}
      - NEXT_PUBLIC_ENV=development
      - NEXT_PUBLIC_API_URL=${FRONTEND_API_URL:-http://localhost:${BACKEND_PORT:-3001}}
      - NEXT_PUBLIC_POSTHOG_KEY=${NEXT_PUBLIC_POSTHOG_KEY}
      - NEXT_PUBLIC_POSTHOG_HOST=${NEXT_PUBLIC_POSTHOG_HOST:-https://us.i.posthog.com}
      - NEXT_PUBLIC_MAINTENANCE_MODE=${NEXT_PUBLIC_MAINTENANCE_MODE:-false}
      - RESPONSIVEVOICE_API_KEY=${RESPONSIVEVOICE_API_KEY:-}
      - POSTHOG_PERSONAL_API_KEY=${POSTHOG_PERSONAL_API_KEY:-}
      - POSTHOG_PROJECT_ID=${POSTHOG_PROJECT_ID:-}
      - POSTHOG_QUERY_HOST=${POSTHOG_QUERY_HOST:-https://us.posthog.com}
      - POSTHOG_QUERY_CACHE_TTL_MS=${POSTHOG_QUERY_CACHE_TTL_MS:-}
      - AUTH_SECRET=${AUTH_SECRET:-change-me-in-development}
      - AUTH_TRUST_HOST=${AUTH_TRUST_HOST:-true}
      - AUTH_GOOGLE_ID=${AUTH_GOOGLE_ID:-}
      - AUTH_GOOGLE_SECRET=${AUTH_GOOGLE_SECRET:-}
      - AUTH_OAUTH_UPSERT_TOKEN=${AUTH_OAUTH_UPSERT_TOKEN:-change-me-in-development}
      - BACKEND_INTERNAL_URL=${BACKEND_INTERNAL_URL:-http://back:${BACKEND_PORT:-3001}}
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:${FRONTEND_PORT:-3000}/api/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      back:
        condition: service_healthy
    networks:
      - frontend
      - backend

  back:
    build:
      context: .
      dockerfile: ./back/Dockerfile
      target: build
    command: sh -c "cd back && npm run start:dev"
    ports:
      - "${BACKEND_PORT:-3001}:${BACKEND_PORT:-3001}"
    volumes:
      - ./:/app
      - root_node_modules:/app/node_modules
      - back_node_modules:/app/back/node_modules
    environment:
      - BACKEND_PORT=${BACKEND_PORT:-3001}
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/template}
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-15m}
      - JWT_ISSUER=${JWT_ISSUER:-gameplate}
      - MAGIC_LINK_SECRET=${MAGIC_LINK_SECRET:-change-me-in-production}
      - MAGIC_LINK_EXPIRATION_MIN=${MAGIC_LINK_EXPIRATION_MIN:-15}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:${FRONTEND_PORT:-3000}}
      - POSTHOG_API_KEY=${POSTHOG_API_KEY}
      - POSTHOG_HOST=${POSTHOG_HOST:-https://us.i.posthog.com}
      - AUTH_OAUTH_UPSERT_TOKEN=${AUTH_OAUTH_UPSERT_TOKEN:-change-me-in-development}
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:${BACKEND_PORT:-3001}/api/v1/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-template}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend

volumes:
  postgres_data:
  root_node_modules:
  front_node_modules:
  back_node_modules:

networks:
  frontend:
  backend:
