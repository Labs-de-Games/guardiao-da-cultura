# Required environment variables for this stack:
#   DATABASE_URL              - PostgreSQL connection string
#   JWT_SECRET                - Secret key for JWT signing
#   MAGIC_LINK_SECRET         - Secret key for magic link signing
#   POSTGRES_USER             - PostgreSQL username
#   POSTGRES_PASSWORD         - PostgreSQL password
#   POSTGRES_DB               - PostgreSQL database name
#   CLOUDFLARE_TUNNEL_TOKEN   - Cloudflare Tunnel token
#
# Optional environment variables:
#   FRONTEND_PORT             - Frontend port (default: 3000)
#   BACKEND_PORT              - Backend port (default: 3001)
#   FRONTEND_URL              - Frontend URL
#   FRONTEND_API_URL          - Public API URL exposed to frontend
#   JWT_EXPIRATION            - JWT expiry
#   JWT_ISSUER                - JWT issuer
#   MAGIC_LINK_EXPIRATION_MIN - Magic link expiry in minutes
#   EMAIL_PROVIDER            - mock | nodemailer
#   EMAIL_FROM                - Sender address
#   GMAIL_USER                - Gmail address (required if EMAIL_PROVIDER=nodemailer)
#   GMAIL_APP_PASSWORD        - Gmail app password (required if EMAIL_PROVIDER=nodemailer)
#
# You can set them in a .env file in the project root.

services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    restart: unless-stopped
    depends_on:
      - nginx
    networks:
      - frontend
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.1"
          memory: 64M

  nginx:
    build:
      context: .
      dockerfile: ./nginx/Dockerfile
      args:
        - NGINX_CONFIG=nginx.production.conf
    environment:
      - FRONTEND_PORT=${FRONTEND_PORT:-3000}
      - BACKEND_PORT=${BACKEND_PORT:-3001}
    image: gameplate-nginx:latest
    ports:
      - "${NGINX_PORT:-81}:80"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:80/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      front:
        condition: service_healthy
      back:
        condition: service_healthy
    networks:
      - frontend
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.1"
          memory: 64M

  front:
    image: ghcr.io/labs-de-games/gameplate-front:${IMAGE_TAG:-master}
    pull_policy: always
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_ENV=production
      - HOSTNAME=0.0.0.0
      - PORT=${FRONTEND_PORT:-3000}
      - NEXT_PUBLIC_API_URL=${FRONTEND_API_URL}
      - NEXT_PUBLIC_POSTHOG_KEY=${NEXT_PUBLIC_POSTHOG_KEY}
      - NEXT_PUBLIC_POSTHOG_HOST=${NEXT_PUBLIC_POSTHOG_HOST:-https://us.i.posthog.com}
      - RESPONSIVEVOICE_API_KEY=${RESPONSIVEVOICE_API_KEY:-}
      - POSTHOG_PERSONAL_API_KEY=${POSTHOG_PERSONAL_API_KEY:-}
      - POSTHOG_PROJECT_ID=${POSTHOG_PROJECT_ID:-}
      - POSTHOG_QUERY_HOST=${POSTHOG_QUERY_HOST:-https://us.posthog.com}
      - POSTHOG_QUERY_CACHE_TTL_MS=${POSTHOG_QUERY_CACHE_TTL_MS:-}
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_TRUST_HOST=${AUTH_TRUST_HOST:-true}
      - AUTH_URL=${AUTH_URL:-}
      - AUTH_GOOGLE_ID=${AUTH_GOOGLE_ID}
      - AUTH_GOOGLE_SECRET=${AUTH_GOOGLE_SECRET}
      - AUTH_OAUTH_UPSERT_TOKEN=${AUTH_OAUTH_UPSERT_TOKEN}
      - BACKEND_INTERNAL_URL=${BACKEND_INTERNAL_URL:-http://back:${BACKEND_PORT:-3001}}
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:${FRONTEND_PORT:-3000}/api/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      back:
        condition: service_healthy
    networks:
      - frontend
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M

  back:
    image: ghcr.io/labs-de-games/gameplate-back:${IMAGE_TAG:-master}
    pull_policy: always
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - BACKEND_PORT=${BACKEND_PORT:-3001}
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION}
      - JWT_ISSUER=${JWT_ISSUER}
      - MAGIC_LINK_SECRET=${MAGIC_LINK_SECRET}
      - MAGIC_LINK_EXPIRATION_MIN=${MAGIC_LINK_EXPIRATION_MIN}
      - FRONTEND_URL=${FRONTEND_URL}
      - EMAIL_PROVIDER=${EMAIL_PROVIDER}
      - EMAIL_FROM=${EMAIL_FROM}
      - GMAIL_USER=${GMAIL_USER}
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD}
      - POSTHOG_API_KEY=${POSTHOG_API_KEY}
      - POSTHOG_HOST=${POSTHOG_HOST:-https://us.i.posthog.com}
      - AUTH_OAUTH_UPSERT_TOKEN=${AUTH_OAUTH_UPSERT_TOKEN}
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:${BACKEND_PORT:-3001}/api/v1/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-template}
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M

volumes:
  postgres_data:

networks:
  frontend:
  backend:
