# Required environment variables for this stack:
#   DATABASE_URL      - PostgreSQL connection string
#   JWT_SECRET        - Secret key for JWT signing
#   MAGIC_LINK_SECRET - Secret key for magic link signing
#   POSTGRES_USER     - PostgreSQL username
#   POSTGRES_PASSWORD - PostgreSQL password
#   POSTGRES_DB       - PostgreSQL database name
#   CLOUDFLARE_TUNNEL_TOKEN - Cloudflare Tunnel token
#
# Optional environment variables:
#   FRONTEND_URL              - Frontend URL
#   JWT_EXPIRATION            - JWT expiry
#   JWT_ISSUER                - JWT issuer
#   MAGIC_LINK_EXPIRATION_MIN - Magic link expiry in minutes
#   EMAIL_PROVIDER            - mock | nodemailer
#   EMAIL_FROM                - Sender address
#   GMAIL_USER                - Gmail address (required if EMAIL_PROVIDER=nodemailer)
#   GMAIL_APP_PASSWORD        - Gmail app password (required if EMAIL_PROVIDER=nodemailer)
#
# You can set them in a .env file in the project root.

services:
  front:
    extends:
      file: compose.base.yaml
      service: front
    image: ghcr.io/labs-de-games/gameplate-front:latest
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:3001",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - frontend
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M

  back:
    extends:
      file: compose.base.yaml
      service: back
    image: ghcr.io/labs-de-games/gameplate-back:latest
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-3001}
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION}
      - JWT_ISSUER=${JWT_ISSUER}
      - MAGIC_LINK_SECRET=${MAGIC_LINK_SECRET}
      - MAGIC_LINK_EXPIRATION_MIN=${MAGIC_LINK_EXPIRATION_MIN}
      - FRONTEND_URL=${FRONTEND_URL}
      - EMAIL_PROVIDER=${EMAIL_PROVIDER}
      - EMAIL_FROM=${EMAIL_FROM}
      - GMAIL_USER=${GMAIL_USER}
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD}
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M

  postgres:
    extends:
      file: compose.base.yaml
      service: postgres
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M

  nginx:
    extends:
      file: compose.base.yaml
      service: nginx
    build:
      context: .
      dockerfile: ./nginx/Dockerfile
      args:
        - NGINX_CONFIG=nginx.prod.conf
    image: gameplate-nginx:latest
    ports:
      - "80:80"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - frontend
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.1"
          memory: 64M

  cloudflared:
    image: cloudflare/cloudflared:latest
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    command: tunnel run --token ${TUNNEL_TOKEN}
    restart: unless-stopped
    depends_on:
      - nginx
    networks:
      - frontend
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.1"
          memory: 64M

volumes:
  postgres_data:

networks:
  frontend:
  backend:
