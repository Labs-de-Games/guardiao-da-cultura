services:
  front:
    build:
      context: .
      dockerfile: ./front/Dockerfile
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:${FRONTEND_PORT:-3000}",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      back:
        condition: service_healthy

  back:
    build:
      context: .
      dockerfile: ./back/Dockerfile
    environment:
      - BACKEND_PORT=${BACKEND_PORT:-3001}
      - DATABASE_URL=${DATABASE_URL}
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:${BACKEND_PORT:-3001}/api/v1/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-template}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  nginx:
    build:
      context: .
      dockerfile: ./nginx/Dockerfile
      args:
        - NGINX_CONFIG=nginx.development.conf
    environment:
      - FRONTEND_PORT=${FRONTEND_PORT:-3000}
      - BACKEND_PORT=${BACKEND_PORT:-3001}
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:80/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      front:
        condition: service_healthy
      back:
        condition: service_healthy

volumes:
  postgres_data:
  front_node_modules:
  back_node_modules:

networks:
  frontend:
  backend:
