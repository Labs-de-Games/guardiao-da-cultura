sonar.projectKey=gameplate
sonar.projectName=gameplate
sonar.sources=back/src,front/src
sonar.tests=back/test,front/src
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts,**/*.test.tsx
sonar.exclusions=**/node_modules/**,**/dist/**,**/.next/**,**/coverage/**,**/*.spec.ts,**/*.test.ts,**/*.test.tsx
sonar.coverage.exclusions=**/*.d.ts,**/*.module.ts,**/*.config.ts,back/test/**,front/src/**/*.test.ts,front/src/**/*.test.tsx
sonar.javascript.lcov.reportPaths=back/coverage/lcov.info,front/coverage/lcov.info
sonar.dependencyCheck.jsonReportPath=reports/dependency-check-report.json
sonar.sourceEncoding=UTF-8
