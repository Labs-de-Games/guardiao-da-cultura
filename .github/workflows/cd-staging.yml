name: CD Staging

on:
  push:
    branches:
      - develop
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  FRONT_IMAGE: ghcr.io/labs-de-games/gameplate-front
  BACK_IMAGE: ghcr.io/labs-de-games/gameplate-back

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: vars
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          FULL_TAG="develop-${SHORT_SHA}"
          echo "image_tag=${FULL_TAG}" >> $GITHUB_OUTPUT

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push front image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./front/Dockerfile
          push: true
          tags: |
            ${{ env.FRONT_IMAGE }}:develop-${{ steps.vars.outputs.image_tag }}
            ${{ env.FRONT_IMAGE }}:develop
          build-args: |
            NEXT_PUBLIC_POSTHOG_KEY=${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
            NEXT_PUBLIC_POSTHOG_HOST=${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}
            NEXT_PUBLIC_ENV=staging
            NEXT_PUBLIC_MAINTENANCE_MODE=${{ vars.NEXT_PUBLIC_MAINTENANCE_MODE || 'false' }}

      - name: Build and push back image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./back/Dockerfile
          push: true
          tags: |
            ${{ env.BACK_IMAGE }}:develop-${{ steps.vars.outputs.image_tag }}
            ${{ env.BACK_IMAGE }}:develop

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify staging deploy
        env:
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL_STAGING }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK_URL" ] || [ -z "$COOLIFY_TOKEN" ]; then
            echo "::error::COOLIFY_WEBHOOK_URL_STAGING or COOLIFY_TOKEN is not configured."
            echo "To enable staging deployments:"
            echo "1. Open your Coolify dashboard and go to the staging app settings."
            echo "2. Copy the Webhook URL for automatic deployments."
            echo "3. Go to Keys & Tokens > API Tokens and create a new token with Deploy permissions."
            echo "4. In this GitHub repository, go to Settings > Secrets and variables > Actions."
            echo "5. Create Repository Secrets named COOLIFY_WEBHOOK_URL_STAGING and COOLIFY_TOKEN."
            exit 1
          fi
          echo "Triggering staging deployment with tag: ${{ needs.build-and-push.outputs.image_tag }}"
          curl -X POST "$COOLIFY_WEBHOOK_URL" \
            -H "Authorization: Bearer $COOLIFY_TOKEN"
