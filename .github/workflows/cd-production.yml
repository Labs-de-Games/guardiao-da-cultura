name: CD Production

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  FRONT_IMAGE: ghcr.io/labs-de-games/gameplate-front
  BACK_IMAGE: ghcr.io/labs-de-games/gameplate-back

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Never run from a fork. Once the repository is public, a fork would
    # otherwise carry its own copy of this workflow and could reach the
    # deployment secrets through it.
    if: github.repository == 'Labs-de-Games/guardiao-da-cultura'
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}

    steps:
      # Production deploys only from master. Without this, "Run workflow" would
      # deploy whatever branch is selected, and it defaults to the default branch.
      # Failing here, instead of skipping the job, makes a wrong run visible.
      # `deploy` needs this job, so it stops too.
      - name: Require master
        env:
          REF: ${{ github.ref }}
        run: |
          if [[ "$REF" != refs/heads/master ]]; then
            echo "::error::Production deploys only run from master (got $REF)."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: vars
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "image_tag=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push front image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./front/Dockerfile
          push: true
          tags: |
            ${{ env.FRONT_IMAGE }}:master-${{ steps.vars.outputs.image_tag }}
            ${{ env.FRONT_IMAGE }}:master
          build-args: |
            NEXT_PUBLIC_POSTHOG_KEY=${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
            NEXT_PUBLIC_POSTHOG_HOST=${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}
            NEXT_PUBLIC_ENV=production
            NEXT_PUBLIC_MAINTENANCE_MODE=${{ vars.NEXT_PUBLIC_MAINTENANCE_MODE || 'false' }}

      - name: Build and push back image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./back/Dockerfile
          push: true
          tags: |
            ${{ env.BACK_IMAGE }}:master-${{ steps.vars.outputs.image_tag }}
            ${{ env.BACK_IMAGE }}:master

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    # Never run from a fork. Once the repository is public, a fork would
    # otherwise carry its own copy of this workflow and could reach the
    # deployment secrets through it.
    if: github.repository == 'Labs-de-Games/guardiao-da-cultura'
    steps:
      - name: Trigger Coolify production deploy
        env:
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL_PRODUCTION }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK_URL" ] || [ -z "$COOLIFY_TOKEN" ]; then
            echo "::error::COOLIFY_WEBHOOK_URL_PRODUCTION or COOLIFY_TOKEN is not configured."
            echo "To enable production deployments:"
            echo "1. Open your Coolify dashboard and go to the production app settings."
            echo "2. Copy the Webhook URL for automatic deployments."
            echo "3. Go to Keys & Tokens > API Tokens and create a new token with Deploy permissions."
            echo "4. In this GitHub repository, go to Settings > Secrets and variables > Actions."
            echo "5. Create Repository Secrets named COOLIFY_WEBHOOK_URL_PRODUCTION and COOLIFY_TOKEN."
            exit 1
          fi
          echo "Triggering production deployment with tag: ${{ needs.build-and-push.outputs.image_tag }}"
          curl -X POST "$COOLIFY_WEBHOOK_URL" \
            -H "Authorization: Bearer $COOLIFY_TOKEN"
